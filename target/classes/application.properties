# ==============================================================================
# Configurazione Spring Boot - Portale Immobiliare
# ==============================================================================
server.port=8080

# Nome applicazione
spring.application.name=realestate-portal-backend

# Configurazione Connessione PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/realestate_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Inizializzazione Schema e Dati SQL (Gestita da DatabaseConfig per supportare sia PostgreSQL che H2 fallback)
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# Logging
logging.level.com.realestate.portal=DEBUG
logging.level.org.springframework.jdbc=INFO

# Formattazione JSON
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Europe/Rome

